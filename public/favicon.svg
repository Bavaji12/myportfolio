<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#070910" stroke="url(#grad)" stroke-width="2" />
  <circle cx="32" cy="32" r="24" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />
  <text x="32" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="url(#grad)" filter="url(#glow)">SB</text>
</svg>