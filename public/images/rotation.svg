<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="neonCyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="neonVioletCyan" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="ultraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark translucent background for previewing in IDE -->
  <rect width="600" height="600" fill="#070910" fill-opacity="0.8" rx="300" />

  <!-- Outer Ring 1: High-Tech Compass Calibration Marks -->
  <circle cx="300" cy="300" r="280" stroke="url(#neonCyanViolet)" stroke-width="2.5" stroke-dasharray="12 10" opacity="0.85" filter="url(#ultraGlow)" fill="none" />
  <circle cx="300" cy="300" r="268" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.7" fill="none" />
  
  <!-- Outer Major Arc Segments -->
  <circle cx="300" cy="300" r="250" stroke="#a855f7" stroke-width="4" stroke-dasharray="140 40 60 40" opacity="0.9" filter="url(#ultraGlow)" fill="none" />
  <circle cx="300" cy="300" r="236" stroke="#00f0ff" stroke-width="2" stroke-dasharray="30 20 80 20" opacity="0.75" fill="none" />

  <!-- Target Crosshair Lines -->
  <line x1="300" y1="12" x2="300" y2="52" stroke="#00f0ff" stroke-width="3" filter="url(#ultraGlow)" />
  <line x1="300" y1="548" x2="300" y2="588" stroke="#00f0ff" stroke-width="3" filter="url(#ultraGlow)" />
  <line x1="12" y1="300" x2="52" y2="300" stroke="#a855f7" stroke-width="3" filter="url(#ultraGlow)" />
  <line x1="548" y1="300" x2="588" y2="300" stroke="#a855f7" stroke-width="3" filter="url(#ultraGlow)" />

  <!-- Diagonal Tech Pointer Notches -->
  <line x1="95" y1="95" x2="125" y2="125" stroke="#3b82f6" stroke-width="2" />
  <line x1="505" y1="95" x2="475" y2="125" stroke="#3b82f6" stroke-width="2" />
  <line x1="95" y1="505" x2="125" y2="475" stroke="#3b82f6" stroke-width="2" />
  <line x1="505" y1="505" x2="475" y2="475" stroke="#3b82f6" stroke-width="2" />

  <!-- Middle Gear / Circuit Ring -->
  <circle cx="300" cy="300" r="210" stroke="url(#neonVioletCyan)" stroke-width="3.5" stroke-dasharray="8 6" opacity="0.8" filter="url(#ultraGlow)" fill="none" />
  
  <!-- Secondary Inner Calibration Track -->
  <circle cx="300" cy="300" r="185" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="40 10 10 10" opacity="0.85" fill="none" />
  
  <!-- Geometric Tech Nodes -->
  <rect x="295" y="22" width="10" height="10" fill="#00f0ff" filter="url(#ultraGlow)" />
  <rect x="295" y="568" width="10" height="10" fill="#00f0ff" filter="url(#ultraGlow)" />
  <rect x="22" y="295" width="10" height="10" fill="#a855f7" filter="url(#ultraGlow)" />
  <rect x="568" y="295" width="10" height="10" fill="#a855f7" filter="url(#ultraGlow)" />
</svg>
